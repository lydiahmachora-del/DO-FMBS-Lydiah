name: Code quality and core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_app.txt

      - name: Install portable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.24.3 scipy==1.15.3
          python -m pip check

      - name: Compile Python source
        run: |
          python -m compileall -q \
            app.py \
            phase1_data_preparation.py \
            phase2_federated_learning.py \
            phase3_adversarial_attacks.py \
            phase4_defense_mechanisms.py \
            phase5_model_validation.py \
            phase6_constrained_dynamic_optimization.py \
            scripts \
            tests

      - name: Run portable unit tests
        run: |
          python -m unittest -v \
            tests.test_constrained_dynamic_model \
            tests.test_instrumented_pipeline_evidence.InstrumentedPipelineUnitTests

      - name: Run constrained-model smoke simulation
        env:
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/constrained-dynamic-model-smoke
        run: python phase6_constrained_dynamic_optimization.py --output-dir "$SMOKE_OUTPUT_DIR"

      - name: Verify isolated smoke outputs and model constraints
        shell: bash
        env:
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/constrained-dynamic-model-smoke
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ["SMOKE_OUTPUT_DIR"]).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          fit_path = output_dir / "model_fit.json"
          schedule_path = output_dir / "dynamic_optimization_schedule.csv"
          if not fit_path.is_file() or not schedule_path.is_file():
              raise SystemExit(f"Smoke outputs are missing from {output_dir}.")
          if output_dir.is_relative_to(workspace):
              raise SystemExit("Smoke evidence must be written outside the checkout.")

          fit = json.loads(fit_path.read_text())
          with schedule_path.open(newline="") as stream:
              schedule = list(csv.DictReader(stream))
          if not fit["constraints_satisfied"] or len(schedule) != 12:
              raise SystemExit("Smoke evidence is incomplete or violates model constraints.")
          print("Smoke evidence is complete, constraint-valid, and isolated from the checkout.")
          PY
